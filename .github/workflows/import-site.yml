name: Import Sikh Tactical source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack committed source
        run: |
          unzip -o sikh-tactical-source.zip
          rm sikh-tactical-source.zip
          rm .github/workflows/import-site.yml
      - name: Commit complete source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Sikh Tactical source"
          git push
